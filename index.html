    --text:#15202e; --text-2:#33414f; --muted:#5d6b7d;

    --good:#15803d; --good-tint:#e7f5ec; --warn:#b45309; --warn-tint:#fbf0e1; --bad:#b91c1c; --bad-tint:#fbe9e9;

  .dark{
    --bg:#0a0f15; --surface:#131a22; --surface-2:#1a232d; --border:#26313d; --border-strong:#36434f;
    --text:#e7eef5; --text-2:#c2cdd9; --muted:#8593a3;

  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum';}
  ::-webkit-scrollbar{width:10px;height:10px}

  input,select,textarea,button{font-family:inherit}
  @keyframes glabFade{from{opacity:0}to{opacity:1}}
  @keyframes glabRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes glabSlideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  @keyframes glabPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .glab-tabs::-webkit-scrollbar{display:none}
  .glab-card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  @media (max-width:920px){
    .glab-dash-grid,.glab-an-grid,.glab-finder-grid{grid-template-columns:1fr !important}
    .glab-log-grid{grid-template-columns:1fr !important}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================================
   Genetic Laboratory Management SPA — single-file vanilla implementation.
   Ported from the Claude Design handoff (DCLogic component) to a tiny
   framework-free runtime: batched setState, focus-preserving DOM morph,
   and event delegation. All business logic is preserved verbatim.
   ========================================================================== */

/* ---------- html escaping for text + attribute interpolation ---------- */
var ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,function(c){return ESC_MAP[c];}); }

/* ---------- focus-preserving DOM morph (mini virtual-dom diff) ---------- */
function isField(el){ var t=el.tagName; return t==='INPUT'||t==='TEXTAREA'||t==='SELECT'; }
function sameNode(a,b){ if(a.nodeType!==b.nodeType) return false; if(a.nodeType===1) return a.tagName===b.tagName; return true; }
function morphAttrs(from,to){
  var fa=from.attributes, ta=to.attributes, i, a;
  for(i=ta.length-1;i>=0;i--){ a=ta[i]; if(from.getAttribute(a.name)!==a.value) from.setAttribute(a.name,a.value); }
  for(i=fa.length-1;i>=0;i--){ a=fa[i]; if(!to.hasAttribute(a.name)) from.removeAttribute(a.name); }
}
function morph(from,to){
  if(from.nodeType===3){ if(from.nodeValue!==to.nodeValue) from.nodeValue=to.nodeValue; return; }
  if(from.nodeType!==1) return;
  if(from.tagName==='CANVAS') return; // let Chart.js own the canvas
  morphAttrs(from,to);
  var f=from.firstChild, t=to.firstChild, nf, nt;
  while(t){
    nt=t.nextSibling;
    if(!f){ from.appendChild(t); t=nt; continue; }
    nf=f.nextSibling;
    if(sameNode(f,t)){ morph(f,t); }
    else { from.replaceChild(t,f); }
    f=nf; t=nt;
  }
  while(f){ nf=f.nextSibling; from.removeChild(f); f=nf; }
}

/* ---------- base runtime: state, batching, render, delegation ---------- */
function Runtime(){}
Runtime.prototype.setState=function(patch,cb){
  if(!this._queue) this._queue=[];
  this._queue.push([patch,cb]);
  if(!this._scheduled){ this._scheduled=true; var self=this; queueMicrotask(function(){ self._flush(); }); }
};
Runtime.prototype._flush=function(){
  var q=this._queue; this._queue=[]; this._scheduled=false; var cbs=[];
  for(var i=0;i<q.length;i++){ var patch=q[i][0], cb=q[i][1]; var p=(typeof patch==='function')?patch(this.state):patch; this.state=Object.assign({},this.state,p); if(cb)cbs.push(cb); }
  this.render();
  for(var j=0;j<cbs.length;j++) cbs[j]();
};
Runtime.prototype.ev=function(map){ var id=++this._evc; this._ev[id]=map; return ' data-ev="'+id+'"'; };
Runtime.prototype.val=function(v){ return ' data-val="'+esc(v)+'"'; };
Runtime.prototype.sh=function(css){ return ' data-sh="'+esc(css)+'"'; };
Runtime.prototype._bindEvents=function(){
  var self=this, root=this._root;
  ['click','input','change','keydown'].forEach(function(type){
    root.addEventListener(type,function(e){
      var el=e.target;
      while(el && el!==root){
        if(el.getAttribute && el.hasAttribute('data-ev')){ var map=self._ev[el.getAttribute('data-ev')]; if(map && map[type]){ map[type](e); return; } }
        el=el.parentNode;
      }
    },false);
  });
  root.addEventListener('mouseover',function(e){ var el=e.target; while(el&&el!==root){ if(el.getAttribute&&el.hasAttribute('data-sh')){ el._base=el.getAttribute('style')||''; el.setAttribute('style',el._base+';'+el.getAttribute('data-sh')); return; } el=el.parentNode; } });
  root.addEventListener('mouseout',function(e){ var el=e.target; while(el&&el!==root){ if(el.getAttribute&&el.hasAttribute('data-sh')&&el._base!=null){ el.setAttribute('style',el._base); return; } el=el.parentNode; } });
};
Runtime.prototype.render=function(){
  if(!this.state.ready) return;
  var prev=this._prevState||{};
  this._ev={}; this._evc=0;
  var out=this.renderVals();
  var html=this.template(out);
  var tmp=document.createElement('div');
  tmp.innerHTML=html;
  if(!this._root.firstElementChild) this._root.appendChild(tmp.firstElementChild);
  else morph(this._root.firstElementChild,tmp.firstElementChild);
  // reconcile controlled fields (set .value property; skip the focused element)
  var fields=this._root.querySelectorAll('[data-val]');
  for(var i=0;i<fields.length;i++){ var el=fields[i]; if(el===document.activeElement) continue; var v=el.getAttribute('data-val'); if(el.value!==v) el.value=v; }
  this._prevState=Object.assign({},this.state);
  this.componentDidUpdate(null,prev);
};

/* ============================================================================
   Application logic — ported verbatim from the design component (DCLogic).
   ========================================================================== */
class App extends Runtime {
  // ---------- constants ----------
  PROTOCOLS = {
    NGS:   { fg:'#0369a1', bg:'#e8f2f9', dfg:'#7dd3fc', dbg:'#0f2735' },
    PCR:   { fg:'#0f766e', bg:'#e3f4f1', dfg:'#5eead4', dbg:'#0c2622' },
    Sanger:{ fg:'#7c3aed', bg:'#f0e9fb', dfg:'#c4b5fd', dbg:'#221634' },
    FISH:  { fg:'#b45309', bg:'#fbf0e1', dfg:'#fbbf24', dbg:'#2a2008' },
    IHC:   { fg:'#be123c', bg:'#fbe7ec', dfg:'#fb7185', dbg:'#2c1119' },
    'RT-PCR':{ fg:'#0891b2', bg:'#e3f3f7', dfg:'#67e8f9', dbg:'#0a2630' }
  };
  STATUS = {
    Received:    { fg:'#475569', bg:'#eef1f5', dfg:'#cbd5e1', dbg:'#222c38' },
    'In Progress':{ fg:'#b45309', bg:'#fbf0e1', dfg:'#fbbf24', dbg:'#2a2008' },
    Reported:    { fg:'#15803d', bg:'#e7f5ec', dfg:'#4ade80', dbg:'#0f2419' },
    Cancelled:   { fg:'#b91c1c', bg:'#fbe9e9', dfg:'#f87171', dbg:'#2a1313' }
  };
  CLINICAL_USE = ['Diagnostic','Predictive','Treatment guidance','Pharmacogenomic','Carrier screening','Prognostic'];
  SAMPLE_TYPES = ['Blood (EDTA)','Saliva','FFPE','Fresh tissue','Buccal swab','Bone marrow'];
  AGE_GROUPS = ['<18','18-29','30-39','40-49','50-59','60-69','70+'];
  SEX = ['F','M','Other','Undisclosed'];
  STATUSES = ['Received','In Progress','Reported','Cancelled'];
  SCHEMA_VERSION = 3;
  KEY = 'glab_v1_';

  state = {
    ready:false, route:'dashboard', theme:'light', isAdmin:false,
    tests:[], kits:[], departments:[], logs:[], audit:[], meta:{},
    dashScope:'month',
    search:'', filterProtocol:'', filterDept:'', filterUse:'',
    modalTestId:null,
    adminGateOpen:false, adminInput:'', adminError:'',
    actorModalOpen:false, actorInput:'', auditOpen:false, auditFilter:'',
    confirm:null,
    toasts:[],
    testForm:null, kitForm:null,
    logForm:this.blankLog(), logErrors:{},
    invSort:'name', analyticsRange:'all', mobileMenu:false, invFilter:'all', adminMenu:false, finderQuery:'', finderDisease:'', finderDept:''
  };

  blankLog(){ return { patientCode:'', testId:'', departmentId:'', requestingDoctor:'', ageGroup:'', sex:'', dateReceived:new Date().toISOString().slice(0,10), dateReported:'', status:'Received' }; }

  // ---------- Store adapter (localStorage; swap impl for Supabase later) ----------
  Store = {
    self:null,
    getCollection(name){ try{ const r=localStorage.getItem(this.self.KEY+name); return r?JSON.parse(r):null; }catch(e){ return null; } },
    saveCollection(name,arr){ try{ localStorage.setItem(this.self.KEY+name,JSON.stringify(arr)); return true; }catch(e){ this.self.toast('Storage full — export a backup','bad'); return false; } },
    getMeta(){ try{ const r=localStorage.getItem(this.self.KEY+'meta'); return r?JSON.parse(r):{}; }catch(e){ return {}; } },
    setMeta(m){ try{ localStorage.setItem(this.self.KEY+'meta',JSON.stringify(m)); }catch(e){} }
  };

  componentDidMount(){
    this.Store.self=this;
    const meta=this.Store.getMeta();
    let tests=this.Store.getCollection('tests');
    if(!tests){ const seed=this.buildSeed(); tests=seed.tests; this.Store.saveCollection('tests',seed.tests); this.Store.saveCollection('kits',seed.kits); this.Store.saveCollection('departments',seed.departments); this.Store.saveCollection('logs',seed.logs); meta.seed=true; meta.schemaVersion=this.SCHEMA_VERSION; this.Store.setMeta(meta); }
    let kits=this.Store.getCollection('kits')||[];
    let departments=this.Store.getCollection('departments')||[];
    let logs=this.Store.getCollection('logs')||[];
    let audit=this.Store.getCollection('audit')||[];
    const fromV=meta.schemaVersion||0;
    if(fromV<this.SCHEMA_VERSION){ const migrated=this.migrate(fromV,{tests,kits,departments,logs}); tests=migrated.tests; kits=migrated.kits; departments=migrated.departments; logs=migrated.logs; meta.schemaVersion=this.SCHEMA_VERSION; this.Store.saveCollection('tests',tests); this.Store.saveCollection('kits',kits); this.Store.saveCollection('departments',departments); this.Store.saveCollection('logs',logs); this.Store.setMeta(meta); }
    let theme=meta.theme; if(!theme){ theme=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
    this.applyTheme(theme);
    const route=this.routeFromHash();
    window.addEventListener('hashchange',()=>{ const r=this.routeFromHash(); const patch={route:r, modalTestId:null}; if(r==='log'&&!this.state.logForm.id&&!this.state.logForm.patientCode){ patch.logForm={...this.state.logForm,patientCode:this.nextPatientCode()}; } this.setState(patch); });
    window.addEventListener('keydown',(e)=>{ if(e.key==='Tab'){ this.trapTab(e); } if(e.key==='Escape'){ const st=this.state; if(st.confirm){ this.closeConfirm(); } else if(st.actorModalOpen){ this.closeActorModal(); } else if(st.auditOpen){ this.closeAudit(); } else if(st.testForm){ this.requestCloseTestForm(); } else if(st.kitForm){ this.requestCloseKitForm(); } else { this.setState({modalTestId:null,adminGateOpen:false,adminMenu:false}); } } });
    window.addEventListener('click',()=>{ if(this.state.adminMenu) this.setState({adminMenu:false}); });
    this.setState({ready:true,tests,kits,departments,logs,audit,meta,theme,route});
  }

  // ---------- audit trail ----------
  actorName(){ return (this.state.meta.actor||'').trim()||'Unattributed'; }
  logAudit(action,summary,entity,entityId){ const e={ id:this.uuid(), ts:this.now(), actor:this.actorName(), action, summary, entity:entity||'', entityId:entityId||'' }; const audit=[e,...(this.state.audit||[])].slice(0,1000); this.setState({audit},()=>this.persist('audit')); }
  openActorModal(){ this.setState({actorModalOpen:true, actorInput:this.state.meta.actor||''}); }
  closeActorModal(){ this.setState({actorModalOpen:false}); }
  saveActor(){ const v=(this.state.actorInput||'').trim(); const meta={...this.state.meta,actor:v}; this.Store.setMeta(meta); this.setState({meta,actorModalOpen:false}); if(v)this.toast('Working as '+v,'good'); }
  openAudit(){ this.setState({auditOpen:true,adminMenu:false,auditFilter:''}); }
  closeAudit(){ this.setState({auditOpen:false}); }
  exportAuditCsv(){ const rows=[['timestamp','actor','action','entity','summary']]; (this.state.audit||[]).forEach(e=>rows.push([e.ts,e.actor,e.action,e.entity,e.summary])); this.download('audit-log-'+new Date().toISOString().slice(0,10)+'.csv',this.toCsv(rows),'text/csv'); this.toast('Audit log exported','good'); }

  // ---------- schema migration ----------
  migrate(fromV,data){ const SEED_DEPTS=['Oncology','Pediatrics','Cardiology','Neurology','Endocrinology','Reproductive Medicine / Fertility','Hematology','Clinical Genetics','Internal Medicine','Surgery'];
    const migrations={
      2:(d)=>{ d.tests.forEach(t=>{ if(t.seed===undefined)t.seed=/^t\d+$/.test(t.id); }); d.kits.forEach(k=>{ if(k.seed===undefined)k.seed=/^k\d+$/.test(k.id); }); d.logs.forEach(l=>{ if(l.seed===undefined)l.seed=/^l\d+$/.test(l.id); }); d.departments.forEach(dep=>{ if(dep.seed===undefined)dep.seed=SEED_DEPTS.indexOf(dep.name)>-1; }); return d; },
      3:(d)=>{ const G={ t1:{r:['NCCN Guidelines: Genetic/Familial High-Risk Assessment — Breast, Ovarian, and Pancreatic (v3.2025)','NICE CG164: Familial breast cancer','ACMG/AMP variant interpretation standards (Richards et al., Genet Med 2015)'],d:'2026-03-12',by:'Dr. N. Karimova (Clinical Genetics)'}, t2:{r:['NCCN Guidelines: Non-Small Cell Lung Cancer (v5.2025)','ESMO Clinical Practice Guidelines: metastatic NSCLC (2023)','IASLC Atlas of Molecular Testing'],d:'2026-02-28',by:'Dr. A. Petrov (Molecular Pathology)'}, t6:{r:['NCCN Guidelines: Genetic/Familial High-Risk Assessment — Colorectal (v2.2025)','Revised Bethesda Guidelines (Umar et al., JNCI 2004)','ACMG technical standards for Lynch syndrome'],d:'2026-01-20',by:'Dr. N. Karimova (Clinical Genetics)'}, t8:{r:['EGAPP recommendation statement on thrombophilia testing (Genet Med 2011)','BCSH guidelines: heritable thrombophilia testing (2010)'],d:'2025-11-05',by:'Dr. R. Aliyeva (Hematology)'} }; d.tests.forEach(t=>{ const g=G[t.id]; if(t.references===undefined)t.references=g?g.r:[]; if(t.lastReviewed===undefined)t.lastReviewed=g?g.d:null; if(t.reviewedBy===undefined)t.reviewedBy=g?g.by:''; }); return d; },
    };
    let d=data; for(let v=fromV+1; v<=this.SCHEMA_VERSION; v++){ if(migrations[v]){ try{ d=migrations[v](d)||d; }catch(e){ console.warn('migration '+v+' failed',e); } } } return d;
  }

  // ---------- data tools (admin) ----------
  closeAdminMenu(){ this.setState({adminMenu:false}); }
  clearSampleData(){ this.askConfirm({ title:'Clear sample data?', body:'This removes every seeded demo record — sample tests, kits, departments and ~20 example logs — leaving only data you have entered yourself. Your own records are kept. This cannot be undone.', cta:'Clear sample data', color:'var(--bad)', onYes:()=>{ const tests=this.state.tests.filter(t=>!t.seed); const kits=this.state.kits.filter(k=>!k.seed); const departments=this.state.departments.filter(d=>!d.seed); const logs=this.state.logs.filter(l=>!l.seed); const meta={...this.state.meta,seed:false}; this.Store.setMeta(meta); this.setState({tests,kits,departments,logs,meta,adminMenu:false,openDept:null,modalTestId:null},()=>{ this.persist('tests'); this.persist('kits'); this.persist('departments'); this.persist('logs'); }); this.toast('Sample data cleared — '+(tests.length+kits.length+logs.length)+' of your records kept','good'); this.logAudit('data.clear','Cleared seeded sample data','data',''); } }); }
  restoreSampleData(){ this.askConfirm({ title:'Restore sample data?', body:'This re-seeds the demo tests, kits, departments and example logs alongside any records you have added. Existing records are not removed.', cta:'Restore sample', color:'var(--primary)', onYes:()=>{ const seed=this.buildSeed(); const has=(arr,id)=>arr.some(x=>x.id===id); const tests=[...this.state.tests,...seed.tests.filter(t=>!has(this.state.tests,t.id))]; const kits=[...this.state.kits,...seed.kits.filter(k=>!has(this.state.kits,k.id))]; const departments=[...this.state.departments,...seed.departments.filter(d=>!has(this.state.departments,d.id))]; const logs=[...this.state.logs,...seed.logs.filter(l=>!has(this.state.logs,l.id))]; const meta={...this.state.meta,seed:true}; this.Store.setMeta(meta); this.setState({tests,kits,departments,logs,meta,adminMenu:false},()=>{ this.persist('tests'); this.persist('kits'); this.persist('departments'); this.persist('logs'); }); this.toast('Sample data restored','good'); this.logAudit('data.restore','Restored seeded sample data','data',''); } }); }
  resetAllData(){ this.askConfirm({ title:'Reset ALL data?', body:'This erases everything in this browser — all tests, kits, departments, and logs — and reloads the app with a fresh set of sample data. There is no undo. Consider exporting a backup first.', cta:'Erase & re-seed', color:'var(--bad)', onYes:()=>{ const entry={ id:this.uuid(), ts:this.now(), actor:this.actorName(), action:'data.reset', summary:'Reset all data and re-seeded', entity:'data', entityId:'' }; const audit=[entry,...(this.state.audit||[])].slice(0,1000); this.Store.saveCollection('audit',audit); ['tests','kits','departments','logs'].forEach(n=>{ try{ localStorage.removeItem(this.KEY+n); }catch(e){} }); const meta={...this.state.meta}; delete meta.schemaVersion; this.Store.setMeta(meta); location.reload(); } }); }

  // ---------- full backup / restore (JSON) ----------
  exportBackup(){ const payload={ app:'genetic-lab', schemaVersion:this.SCHEMA_VERSION, exportedAt:this.now(), counts:{tests:this.state.tests.length,kits:this.state.kits.length,departments:this.state.departments.length,logs:this.state.logs.length}, tests:this.state.tests, kits:this.state.kits, departments:this.state.departments, logs:this.state.logs }; this.download('genetic-lab-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(payload,null,2),'application/json'); const meta={...this.state.meta,lastBackup:this.now()}; this.Store.setMeta(meta); this.setState({meta,adminMenu:false}); this.logAudit('data.export','Exported full JSON backup','data',''); this.toast('Full backup exported','good'); }
  triggerImport(){ this.setState({adminMenu:false}); const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.onchange=(e)=>{ const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{ let data; try{ data=JSON.parse(reader.result); }catch(err){ this.toast('Import failed — not valid JSON','bad'); return; } const ok=['tests','kits','departments','logs'].every(k=>Array.isArray(data[k])); if(!ok){ this.toast('Import failed — file is missing required collections','bad'); return; } this.askConfirm({ title:'Restore from this backup?', body:'This will REPLACE all current data ('+this.state.tests.length+' tests, '+this.state.kits.length+' kits, '+this.state.logs.length+' logs) with the file contents ('+data.tests.length+' tests, '+data.kits.length+' kits, '+data.logs.length+' logs). Your current data will be lost unless you exported it.', cta:'Replace all', color:'var(--bad)', onYes:()=>{ const fromV=data.schemaVersion||0; let d={tests:data.tests,kits:data.kits,departments:data.departments,logs:data.logs}; if(fromV<this.SCHEMA_VERSION) d=this.migrate(fromV,d); this.setState({tests:d.tests,kits:d.kits,departments:d.departments,logs:d.logs,modalTestId:null,openDept:null},()=>{ this.persist('tests'); this.persist('kits'); this.persist('departments'); this.persist('logs'); }); this.toast('Backup restored · '+d.tests.length+' tests, '+d.logs.length+' logs','good'); this.logAudit('data.import','Imported backup · '+d.tests.length+' tests, '+d.kits.length+' kits, '+d.logs.length+' logs','data',''); } }); }; reader.readAsText(file); }; inp.click(); }
  daysSinceBackup(){ const lb=this.state.meta.lastBackup; if(!lb)return null; return Math.floor((Date.now()-new Date(lb).getTime())/86400000); }
  setTatBasis(biz){ const meta={...this.state.meta,tatBusinessDays:biz}; this.Store.setMeta(meta); this.setState({meta}); this.toast('Turnaround basis: '+(biz?'working days (Mon–Fri)':'calendar days'),'info'); }

  routeFromHash(){ const h=(location.hash||'').replace('#/','').split('?')[0]; const ok=['dashboard','catalog','finder','departments','inventory','log','analytics']; return ok.includes(h)?h:'dashboard'; }
  go(route){ location.hash='#/'+route; const patch={route,modalTestId:null,mobileMenu:false}; if(route==='log'&&!this.state.logForm.id&&!this.state.logForm.patientCode){ patch.logForm={...this.state.logForm,patientCode:this.nextPatientCode()}; } this.setState(patch); }
  guardNav(proceed){ if(this.state.route==='log'&&this.state.logDirty){ this.askConfirm({ title:'Discard unsaved log?', body:'You have unsaved changes in the test log. Leaving this screen will discard them.', cta:'Discard changes', color:'var(--bad)', onYes:()=>{ this.setState({logDirty:false}); proceed(); } }); } else { proceed(); } }
  requestCloseTestForm(){ if(this.state.testDirty){ this.askConfirm({ title:'Discard changes?', body:'This test form has unsaved changes. Close without saving?', cta:'Discard', color:'var(--bad)', onYes:()=>this.setState({testForm:null,testDirty:false}) }); } else { this.setState({testForm:null}); } }
  requestCloseKitForm(){ if(this.state.kitDirty){ this.askConfirm({ title:'Discard changes?', body:'This kit form has unsaved changes. Close without saving?', cta:'Discard', color:'var(--bad)', onYes:()=>this.setState({kitForm:null,kitDirty:false}) }); } else { this.setState({kitForm:null}); } }

  computeStats(){

    const active=s.logs.filter(l=>l.status!=='Cancelled');
    const scoped=scope==='month'?active.filter(l=>this.inMonth(l.dateReceived)):active;
    const reported=scoped.filter(l=>l.status==='Reported'&&l.turnaroundDays!=null);
    const avgTat=reported.length?Math.round(reported.reduce((a,l)=>a+l.turnaroundDays,0)/reported.length):0;
    const kitsLow=s.kits.filter(k=>k.currentStock<=k.alertThreshold).length;
    const kitsOut=s.kits.filter(k=>k.currentStock<=0).length;
    const cut=new Date(); cut.setDate(cut.getDate()-90);
    const recent90=active.filter(l=>new Date(l.dateReceived)>=cut);
    const counts={}; recent90.forEach(l=>{ counts[l.testId]=(counts[l.testId]||0)+1; });
    const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const top=ranked.length?{name:(this.testById(ranked[0][0])||{}).name||'—',count:ranked[0][1]}:{name:'—',count:0};

  // ===================== ANALYTICS =====================
  rangeLogs(){ const s=this.state; const months={month:1,quarter:3,year:12,all:999}[s.analyticsRange]; const cut=new Date(); cut.setMonth(cut.getMonth()-months); cut.setDate(1); return s.logs.filter(l=>l.status!=='Cancelled'&&(s.analyticsRange==='all'||new Date(l.dateReceived)>=cut)); }
  monthKey(d){ const dt=new Date(d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
  monthLabels(n){ const arr=[]; const d=new Date(); d.setDate(1); for(let i=n-1;i>=0;i--){ const m=new Date(d); m.setMonth(d.getMonth()-i); arr.push(m); } return arr; }
  exportResearchCsv(){ const rows=[['ageGroup','sex','department','testCode','protocol','turnaroundDays','month']]; this.rangeLogs().forEach(l=>{ const t=this.testById(l.testId)||{}; rows.push([l.ageGroup,l.sex,this.deptName(l.departmentId),t.code||'',t.protocol||'',l.turnaroundDays!=null?l.turnaroundDays:'',this.monthKey(l.dateReceived)]); }); this.download('logs-research-'+new Date().toISOString().slice(0,10)+'.csv',this.toCsv(rows),'text/csv'); this.toast('Research export ready (anonymized)','good'); }
  exportOperationalCsv(){ const rows=[['patientCode','test','department','requestingDoctor','ageGroup','sex','dateReceived','dateReported','turnaroundDays','status']]; this.state.logs.forEach(l=>{ const t=this.testById(l.testId)||{}; rows.push([l.patientCode,t.name||'',this.deptName(l.departmentId),l.requestingDoctor||'',l.ageGroup,l.sex,l.dateReceived,l.dateReported||'',l.turnaroundDays!=null?l.turnaroundDays:'',l.status]); }); this.download('logs-operational-'+new Date().toISOString().slice(0,10)+'.csv',this.toCsv(rows),'text/csv'); this.toast('Operational export ready','good'); }
  renderAnalyticsVals(s){ if(s.route!=='analytics') return {}; const ranges=[['month','This month'],['quarter','Quarter'],['year','Year'],['all','All time']];
    return { analyticsRange:s.analyticsRange, rangeChips:ranges.map(([k,l])=>({ label:l, active:s.analyticsRange===k, color:s.analyticsRange===k?'var(--primary)':'var(--muted)', bg:s.analyticsRange===k?'var(--surface)':'transparent', onClick:()=>this.setState({analyticsRange:k},()=>this.drawCharts()) })),
      exportResearchCsv:()=>this.exportResearchCsv(), exportOperationalCsv:()=>this.exportOperationalCsv() };
  }
  scheduleDraw(){ clearTimeout(this._drawT); this._drawT=setTimeout(()=>this.drawCharts(),80); }
  componentDidUpdate(prevP,prevS){ if(this.state.route==='analytics'&&(prevS.route!=='analytics'||prevS.analyticsRange!==this.state.analyticsRange||prevS.theme!==this.state.theme)){ this.scheduleDraw(); } this.manageFocus(); }
  topOverlay(){ const els=[].slice.call(document.querySelectorAll('[data-overlay]')); if(!els.length)return null; els.sort((a,b)=>(+b.getAttribute('data-overlay'))-(+a.getAttribute('data-overlay'))); return els[0]; }
  focusables(root){ return [].slice.call(root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(el=>el.offsetParent!==null); }
  manageFocus(){ const top=this.topOverlay(); if(top&&this._overlayActive!==top){ if(!this._overlayActive)this._lastFocus=document.activeElement; this._overlayActive=top; const f=this.focusables(top); setTimeout(()=>{ const el=f[0]||top; if(el&&el.focus)el.focus(); },20); } else if(!top&&this._overlayActive){ this._overlayActive=null; const lf=this._lastFocus; if(lf&&lf.focus&&document.contains(lf))setTimeout(()=>lf.focus(),10); } }
  trapTab(e){ if(e.key!=='Tab')return; const top=this.topOverlay(); if(!top)return; const f=this.focusables(top); if(!f.length){ e.preventDefault(); return; } const first=f[0], last=f[f.length-1]; const a=document.activeElement; if(e.shiftKey){ if(a===first||!top.contains(a)){ e.preventDefault(); last.focus(); } } else { if(a===last||!top.contains(a)){ e.preventDefault(); first.focus(); } } }
  drawCharts(){ if(typeof Chart==='undefined'||this.state.route!=='analytics')return; const $=id=>document.getElementById(id); this._barEl=$('glab-bar'); this._lineEl=$('glab-line'); this._deptEl=$('glab-dept'); this._ageEl=$('glab-age'); this._sexEl=$('glab-sex'); if(!this._barEl){ this.scheduleDraw(); return; } const dark=this.state.theme==='dark'; const grid=dark?'rgba(255,255,255,.07)':'rgba(16,32,46,.07)'; const tick=dark?'#8593a3':'#5d6b7d'; const prim=dark?'#38bdf8':'#0369a1'; const teal=dark?'#5eead4':'#0f766e';
    Chart.defaults.font.family="'IBM Plex Sans',sans-serif"; Chart.defaults.color=tick; Chart.defaults.font.size=11;
    const logs=this.rangeLogs(); const nMonths=this.state.analyticsRange==='month'?1:(this.state.analyticsRange==='quarter'?3:12); const months=this.monthLabels(Math.max(nMonths,this.state.analyticsRange==='all'?12:nMonths));
    const mKeys=months.map(m=>this.monthKey(m)); const mLabels=months.map(m=>m.toLocaleDateString('en',{month:'short'}));
    const perMonth=mKeys.map(k=>logs.filter(l=>this.monthKey(l.dateReceived)===k).length);
    const tatByMonth=mKeys.map(k=>{ const r=logs.filter(l=>this.monthKey(l.dateReceived)===k&&l.turnaroundDays!=null); return r.length?Math.round(r.reduce((a,l)=>a+l.turnaroundDays,0)/r.length):null; });
    const deptCounts={}; logs.forEach(l=>{ const n=this.deptName(l.departmentId); deptCounts[n]=(deptCounts[n]||0)+1; }); const deptEntries=Object.entries(deptCounts).sort((a,b)=>b[1]-a[1]);
    const ageCounts=this.AGE_GROUPS.map(g=>logs.filter(l=>l.ageGroup===g).length);
    const sexCats=this.SEX; const sexCounts=sexCats.map(x=>logs.filter(l=>l.sex===x).length);
    const mk=(ref,cfg)=>{ if(!ref)return null; if(ref._chart)ref._chart.destroy(); ref._chart=new Chart(ref.getContext('2d'),cfg); return ref._chart; };
    const noLeg={legend:{display:false}}; const base={responsive:true,maintainAspectRatio:false,animation:false,resizeDelay:0};
    mk(this._barEl,{type:'bar',data:{labels:mLabels,datasets:[{data:perMonth,backgroundColor:prim,borderRadius:5,maxBarThickness:34}]},options:{...base,plugins:noLeg,scales:{x:{grid:{display:false}},y:{grid:{color:grid},beginAtZero:true,ticks:{precision:0}}}}});
    mk(this._lineEl,{type:'line',data:{labels:mLabels,datasets:[{data:tatByMonth,borderColor:teal,backgroundColor:'transparent',tension:.35,spanGaps:true,pointRadius:3,pointBackgroundColor:teal,borderWidth:2.5}]},options:{...base,plugins:noLeg,scales:{x:{grid:{display:false}},y:{grid:{color:grid},beginAtZero:true,title:{display:true,text:'days'}}}}});
    mk(this._deptEl,{type:'bar',data:{labels:deptEntries.map(e=>e[0]),datasets:[{data:deptEntries.map(e=>e[1]),backgroundColor:prim,borderRadius:5,maxBarThickness:20}]},options:{...base,indexAxis:'y',plugins:noLeg,scales:{x:{grid:{color:grid},beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}}});
    mk(this._ageEl,{type:'bar',data:{labels:this.AGE_GROUPS,datasets:[{data:ageCounts,backgroundColor:teal,borderRadius:5,maxBarThickness:30}]},options:{...base,plugins:noLeg,scales:{x:{grid:{display:false}},y:{grid:{color:grid},beginAtZero:true,ticks:{precision:0}}}}});
    const sexColors=dark?['#38bdf8','#5eead4','#c4b5fd','#8593a3']:['#0369a1','#0f766e','#7c3aed','#94a3b8'];
    mk(this._sexEl,{type:'doughnut',data:{labels:sexCats,datasets:[{data:sexCounts,backgroundColor:sexColors,borderWidth:0}]},options:{...base,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:10}}}}});
  }

  // ===================== TEST FORM =====================
  openTestForm(test){ const blank={ id:null, code:'', name:'', protocol:'NGS', genes:'', variants:'', diseases:'', departmentIds:[], clinicalUse:[], treatmentRelevance:'', criteria:'', sampleType:[], turnaroundGoalDays:14, kitId:'', kitUnitsPerTest:1, references:'', lastReviewed:'', reviewedBy:'' }; const tf= test? { id:test.id, code:test.code, name:test.name, protocol:test.protocol, genes:(test.genes||[]).join(', '), variants:test.variants||'', diseases:(test.diseases||[]).join(', '), departmentIds:[...(test.departmentIds||[])], clinicalUse:[...(test.clinicalUse||[])], treatmentRelevance:test.treatmentRelevance||'', criteria:(test.criteria||[]).join('\n'), sampleType:[...(test.sampleType||[])], turnaroundGoalDays:test.turnaroundGoalDays, kitId:test.kitId||'', kitUnitsPerTest:test.kitUnitsPerTest||1, references:(test.references||[]).join('\n'), lastReviewed:test.lastReviewed||'', reviewedBy:test.reviewedBy||'' } : blank; this.setState({ testForm:tf, modalTestId:null, testFormErrors:{}, testDirty:false }); }

  saveTest(){ const f=this.state.testForm; const e={}; if(!f.code.trim())e.code='Required'; if(!f.name.trim())e.name='Required'; if(Object.keys(e).length){ this.setState({testFormErrors:e}); this.toast('Code and name are required','bad'); return; }
    const obj={ id:f.id||this.uuid(), code:f.code.trim(), name:f.name.trim(), protocol:f.protocol, genes:f.genes.split(',').map(x=>x.trim()).filter(Boolean), variants:f.variants.trim(), diseases:f.diseases.split(',').map(x=>x.trim()).filter(Boolean), departmentIds:f.departmentIds, clinicalUse:f.clinicalUse, treatmentRelevance:f.treatmentRelevance.trim(), criteria:f.criteria.split('\n').map(x=>x.trim()).filter(Boolean), sampleType:f.sampleType, turnaroundGoalDays:parseInt(f.turnaroundGoalDays,10)||0, kitId:f.kitId||null, kitUnitsPerTest:parseInt(f.kitUnitsPerTest,10)||1, references:f.references.split('\n').map(x=>x.trim()).filter(Boolean), lastReviewed:f.lastReviewed||null, reviewedBy:f.reviewedBy.trim(), active:true, updatedAt:this.now() };
    let tests; if(f.id){ const prev=this.testById(f.id); obj.createdAt=prev.createdAt; obj.notes=prev.notes||''; tests=this.state.tests.map(t=>t.id===f.id?obj:t); } else { obj.createdAt=this.now(); obj.notes=''; tests=[...this.state.tests,obj]; }

    // ----- kit form -----
    if(o.kitFormOpen){ const f=o.kform;
      h+=`<div${this.ev({click:o.closeKitForm})} style="position:fixed;inset:0;z-index:65;background:rgba(8,15,22,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto">
        <div${this.ev({click:o.stop})} data-overlay="65" style="width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg)">
          <div style="padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
            <h2 style="margin:0;font-size:18px;font-weight:700">${esc(o.kitFormTitle)}</h2>
            <button${this.ev({click:o.closeKitForm})} aria-label="Close" style="all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);font-size:17px;color:var(--muted)">×</button>
          </div>
          <div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">
            <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Kit name *</span><input${this.ev({input:o.kf.name})}${this.val(f.name)} style="all:unset;box-sizing:border-box;width:100%;font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text)" /></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Catalog #</span><input${this.ev({input:o.kf.catalogNumber})}${this.val(f.catalogNumber)} style="all:unset;box-sizing:border-box;width:100%;font-family:'IBM Plex Mono';font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text)" /></label>
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Manufacturer</span><input${this.ev({input:o.kf.manufacturer})}${this.val(f.manufacturer)} style="all:unset;box-sizing:border-box;width:100%;font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text)" /></label>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Current stock</span><input${this.ev({input:o.kf.currentStock})}${this.val(f.currentStock)} type="number" style="all:unset;box-sizing:border-box;width:100%;font-family:'IBM Plex Mono';font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text)" /></label>
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Alert ≤ <span title="Low-stock threshold." style="cursor:help;color:var(--muted)">ⓘ</span></span><input${this.ev({input:o.kf.alertThreshold})}${this.val(f.alertThreshold)} type="number" style="all:unset;box-sizing:border-box;width:100%;font-family:'IBM Plex Mono';font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text)" /></label>
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Units / box</span><input${this.ev({input:o.kf.unitsPerKit})}${this.val(f.unitsPerKit)} type="number" style="all:unset;box-sizing:border-box;width:100%;font-family:'IBM Plex Mono';font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text)" /></label>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Last ordered</span><input${this.ev({input:o.kf.lastOrderedDate})}${this.val(f.lastOrderedDate)} type="date" style="all:unset;box-sizing:border-box;width:100%;font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text)" /></label>
              <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11.5px;font-weight:600;color:var(--text-2)">Expiry date</span><input${this.ev({input:o.kf.expiryDate})}${this.val(f.expiryDate)} type="date" style="all:unset;box-sizing:border-box;width:100%;font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text)" /></label>
            </div>
          </div>
          <div style="padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2)">
            <button${this.ev({click:o.closeKitForm})} style="all:unset;cursor:pointer;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);border:1px solid var(--border-strong)">Cancel</button>
            <button${this.ev({click:o.saveKit})} style="all:unset;cursor:pointer;padding:9px 18px;border-radius:9px;font-size:13px;font-weight:700;color:var(--on-primary);background:var(--primary)">Save kit</button>
          </div>
        </div>
      </div>`;
    }
    // ----- admin gate -----
    if(o.adminGateOpen){
      h+=`<div${this.ev({click:o.closeAdminGate})} style="position:fixed;inset:0;z-index:70;background:rgba(8,15,22,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:glabFade .18s ease">
        <div${this.ev({click:o.stop})} data-overlay="70" style="width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;animation:glabPop .2s ease">
          <h2 style="margin:0 0 4px;font-size:18px;font-weight:700">${esc(o.adminGateTitle)}</h2>
          <p style="margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.45">${esc(o.adminGateHint)}</p>
          <input${this.ev({input:o.onAdminInput,keydown:o.onAdminKey})}${this.val(o.adminInput)} type="password" placeholder="Passphrase" aria-label="Admin passphrase" style="all:unset;box-sizing:border-box;width:100%;font-size:14px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:11px 13px;color:var(--text)" />
          ${o.adminError?`<div style="font-size:12px;color:var(--bad);margin-top:8px;font-weight:500">${esc(o.adminError)}</div>`:''}
          <div style="display:flex;gap:9px;margin-top:16px">
            <button${this.ev({click:o.closeAdminGate})} style="all:unset;cursor:pointer;flex:1;text-align:center;padding:10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);border:1px solid var(--border-strong)">Cancel</button>
            <button${this.ev({click:o.submitAdminGate})} style="all:unset;cursor:pointer;flex:1;text-align:center;padding:10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--on-primary);background:var(--primary)">${esc(o.adminGateCta)}</button>
          </div>
        </div>
      </div>`;
    }
    // ----- confirm -----
    if(o.confirmOpen){
      h+=`<div${this.ev({click:o.closeConfirm})} style="position:fixed;inset:0;z-index:75;background:rgba(8,15,22,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:glabFade .18s ease">
        <div${this.ev({click:o.stop})} data-overlay="75" style="width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;animation:glabPop .2s ease">
          <h2 style="margin:0 0 6px;font-size:17px;font-weight:700">${esc(o.confirmTitle)}</h2>
          <p style="margin:0 0 18px;font-size:13px;color:var(--text-2);line-height:1.5">${esc(o.confirmBody)}</p>
          <div style="display:flex;gap:9px;justify-content:flex-end">
            <button${this.ev({click:o.closeConfirm})} style="all:unset;cursor:pointer;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);border:1px solid var(--border-strong)">Cancel</button>
            <button${this.ev({click:o.confirmYes})} style="all:unset;cursor:pointer;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;color:#fff;background:${o.confirmColor}">${esc(o.confirmCta)}</button>
          </div>
        </div>
      </div>`;
    }
    // ----- actor modal -----
    if(o.actorModalOpen){
      h+=`<div${this.ev({click:o.closeActorModal})} style="position:fixed;inset:0;z-index:72;background:rgba(8,15,22,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:glabFade .18s ease">
        <div${this.ev({click:o.stop})} data-overlay="72" style="width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;animation:glabPop .2s ease">
          <h2 style="margin:0 0 4px;font-size:18px;font-weight:700">Who's using this app?</h2>
          <p style="margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.45">Your name or initials are stamped on the audit trail for every change you make. This is attribution, not login — stored only in this browser.</p>
          <input${this.ev({input:o.onActorInput,keydown:o.onActorKey})}${this.val(o.actorInput)} placeholder="e.g. A. Yusupova or AY" aria-label="Your name" style="all:unset;box-sizing:border-box;width:100%;font-size:14px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:11px 13px;color:var(--text)" />
          <div style="display:flex;gap:9px;margin-top:16px">
            <button${this.ev({click:o.closeActorModal})} style="all:unset;cursor:pointer;flex:1;text-align:center;padding:10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);border:1px solid var(--border-strong)">Cancel</button>
            <button${this.ev({click:o.saveActor})} style="all:unset;cursor:pointer;flex:1;text-align:center;padding:10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--on-primary);background:var(--primary)">Save</button>
          </div>
        </div>
      </div>`;
    }
    // ----- audit log -----
    if(o.auditOpen){
      h+=`<div${this.ev({click:o.closeAudit})} style="position:fixed;inset:0;z-index:68;background:rgba(8,15,22,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;animation:glabFade .18s ease">
        <div${this.ev({click:o.stop})} data-overlay="68" style="width:100%;max-width:760px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);animation:glabPop .2s ease;display:flex;flex-direction:column;max-height:82vh">
          <div style="padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:14px">
            <div>
              <h2 style="margin:0;font-size:18px;font-weight:700">Audit log</h2>
              <p style="margin:3px 0 0;font-size:12px;color:var(--muted)">Immutable record of who changed what. Newest first · ${esc(o.auditCount)} entries.</p>
            </div>
            <div style="display:flex;gap:9px;align-items:center">
              <button${this.ev({click:o.exportAuditCsv})} style="all:unset;cursor:pointer;padding:8px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);border:1px solid var(--border-strong)">⬇ CSV</button>
              <button${this.ev({click:o.closeAudit})} aria-label="Close" style="all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);font-size:17px;color:var(--muted)">×</button>
            </div>
          </div>
          <div style="padding:13px 24px;border-bottom:1px solid var(--border)">
            <div style="display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 13px">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input${this.ev({input:o.onAuditFilter})}${this.val(o.auditFilter)} placeholder="Filter by actor, action or description…" aria-label="Filter audit log" style="all:unset;flex:1;font-size:13px;color:var(--text)" />
            </div>
          </div>
          <div style="overflow-y:auto;padding:6px 0">
            ${o.auditEntries.map(e=>`<div style="display:flex;align-items:flex-start;gap:13px;padding:11px 24px;border-bottom:1px solid var(--border)">
              <span style="flex-shrink:0;width:118px;font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono';padding-top:1px">${esc(e.when)}</span>
              <span style="flex-shrink:0;width:96px;font-size:11px;font-weight:700;color:${e.actionColor}">${esc(e.actionLabel)}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:12.5px;color:var(--text-2);line-height:1.4">${esc(e.summary)}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px">by ${esc(e.actor)}</div>
              </div>
            </div>`).join('')}
            ${o.auditEmpty?`<div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:13px">No matching audit entries.</div>`:''}
          </div>
        </div>
      </div>`;
    }
    return h;
  }

  toastsHtml(o){
    return `<div style="position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:9px;max-width:340px">
      ${o.toasts.map(t=>`<div style="background:var(--surface);border:1px solid ${t.border};border-left:4px solid ${t.accent};border-radius:10px;box-shadow:var(--shadow-lg);padding:12px 14px;animation:glabSlideIn .25s ease;display:flex;gap:10px;align-items:flex-start">
        <span style="font-size:15px;line-height:1.2">${esc(t.icon)}</span>
        <div style="font-size:13px;color:var(--text-2);line-height:1.4;flex:1">${esc(t.msg)}</div>
      </div>`).join('')}
    </div>`;
  }
}

/* ---------- bootstrap ---------- */
(function(){
  var app=new App();
  app._root=document.getElementById('app');
  app.mount();
  window.__glab=app; // exposed for debugging
})();
</script>
</body>
</html>
